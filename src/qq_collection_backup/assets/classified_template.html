<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ 收藏</title><style>__THEME__

height:1.8}.filter-row-checkbox{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:12px;margin-top:12px}.filter-row-checkbox input{appearance:none;width:17px;height:17px;min-height:17px;flex:0 0 17px;border-radius:5px;padding:0;background:#fff;display:grid;place-items:center;cursor:pointer}.filter-row-checkbox input:checked{background:#ff5da8;border-color:#ff5da8}.filter-row-checkbox input:checked:after{content:'✓';font-size:13px;font-weight:bold;color:white}.filter-row-checkbox label{margin:0;cursor:pointer}.status-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status-links span{font-size:12px}.links button{font-size:12px} .index-top{margin-top:18px}.sensitive-open .secret-body{margin-top:15px}@media(max-width:760px){.layout{display:block}.stats{gap:22px}.filters .sidebar-note{grid-column:1/-1}.edit-grid{display:block}.actions a{font-size:12px}.header-sub{max-width:100%}}
.body-input{width:100%;min-height:320px;resize:vertical;line-height:1.85;padding:16px;border:1px solid #ead4e1;border-radius:14px;background:#fffdfef2;color:inherit;font:inherit;font-size:15px;box-sizing:border-box}.body-input:focus{outline:2px solid #f3a7ca;outline-offset:2px}.text-editor{margin-top:22px}.text-editor>summary{color:#ab4579;font-weight:600;cursor:pointer;padding:12px 0}.text-editor label{display:block;margin:12px 0 8px}.editor-banner{margin:0 0 18px;padding:16px 20px;border:1px solid #f3d8e8;border-radius:18px;background:#ffffffba;display:flex;gap:14px;align-items:center;justify-content:space-between;color:#955477;font-size:13px}.editor-banner button{font-size:12px}.edit-box>input{width:100%}</style></head><body>
<header class="glass"><div><h1>QQ 收藏</h1><p class="header-sub">优先按你在 QQ 中的原分组查看；领域与用途为独立的初步整理，正文可编辑并保存到本地 Markdown。分类和标签可在每条收藏中调整。未逐条通读的旧版候选明确标为待复核。<span id="coverage"></span></p></div><div class="stats"><span><strong id="total">—</strong>条原收藏</span><span><strong id="tagged">—</strong>条已加标签</span><span><strong id="reviewCount">—</strong>条待复核</span></div></header>
<div class="layout"><aside><section class="panel filters"><h2>分类与筛选</h2><div><label for="qqGroup">QQ 原分组</label><select id="qqGroup"><option value="">全部 QQ 分组</option></select></div><div><label for="domain">领域</label><select id="domain"><option value="">全部领域</option></select></div><div><label for="purpose">用途 / 性质</label><select id="purpose"><option value="">全部用途</option></select></div><div><label for="tag">关键词 / 标签</label><select id="tag"><option value="">全部标签</option></select></div><div><label for="view">整理状态</label><select id="view"><option value="useful">有信息价值的条目</option><option value="all">全部原收藏</option><option value="review">待复核</option><option value="semantic">正文已逐条复核</option><option value="model">旧版候选待复核</option><option value="skipped">暂不加标签</option><option value="sensitive">敏感记录</option><option value="edited">我调整过的条目</option></select></div><div><label for="year">年份</label><select id="year"><option value="">全部年份</option></select></div><div><label for="sort">时间排序</label><select id="sort"><option value="new">从新到旧</option><option value="old">从旧到新</option></select></div><div class="sidebar-note"><div class="filter-row-checkbox"><input id="hideDuplicates" type="checkbox"><label for="hideDuplicates">隐藏完全重复正文</label></div><p class="count-note">只保留确切标签，0—3 个均可。待辨识的图片、表情、裸链接和极短文字仍保留在“全部原收藏”。</p><button class="override-button" id="exportEdits">导出我的分类调整</button><button class="override-button" id="importEdits">导入分类调整</button><input type="file" id="editFile" accept=".json,application/json" hidden><p class="count-note" id="editCount">尚未手动调整分类</p></div></section><section class="panel links"><h2>本地文件</h2><a href="收藏分类索引.xlsx">分类索引 Excel</a><a href="Obsidian笔记库/00-首页.md">Markdown 笔记库</a><a href="bz适配/使用说明.md">bz 导入说明</a><a href="整理说明.md">分类范围与说明</a><p class="note">敏感内容默认遮挡，但本地文件本身未加密。网页不会联网加载图片或检查链接。</p></section></aside>
<main><div class="editor-banner"><span id="editorStatus"></span><button id="stopEditor" hidden>关闭编辑服务</button></div><div class="search-panel"><label class="sr" for="query">检索收藏</label><input id="query" class="search" type="search" placeholder="搜索正文、标题、领域、用途、标签或收藏 ID" autocomplete="off"><div class="toolbar"><span id="result" aria-live="polite"></span><div class="pagination"><button id="reset" class="reset">重置筛选</button><button id="prev">上一页</button><form id="pageJumpForm" novalidate><label for="pageInput">第</label><input id="pageInput" type="number" min="1" step="1" inputmode="numeric" aria-label="跳转页码"><span id="pageTotal" class="page-total"></span><button class="primary" id="pageGo" type="submit">跳转</button></form><button id="next">下一页</button></div><span id="page" class="sr" aria-live="polite"></span></div><p id="pageMessage" class="page-message" role="status"></p></div><div id="storageNotice" class="storage-notice hide"></div><section id="cards" aria-label="分类收藏"></section><div class="toolbar bottom-toolbar"><span>每页 40 条，标签可点击筛选</span><div class="pagination"><button id="prevBottom">上一页</button><form id="pageJumpFormBottom" novalidate><label for="pageInputBottom">第</label><input id="pageInputBottom" type="number" min="1" step="1" inputmode="numeric" aria-label="底部跳转页码"><span id="pageTotalBottom" class="page-total"></span><button class="primary" id="pageGoBottom" type="submit">跳转</button></form><button id="nextBottom">下一页</button></div><p id="pageMessageBottom" class="page-message" role="status"></p></div></main></div>
<script id="archiveData" type="application/json">__ARCHIVE_DATA__</script><script>
const archive=JSON.parse(document.getElementById('archiveData').textContent),data=archive.records,$=id=>document.getElementById(id),size=40,storageKey='qq-collection-classification-v1:'+archive.dataset;
let page=0,filtered=[],overrides={},storageAvailable=true;const revealed=new Set(),base=new Map(data.map(x=>[x.id,JSON.parse(JSON.stringify(x.classification))]));
const yearOf=x=>x.date?x.date.slice(0,4):'时间未知',safeTitle=x=>x.classification.sensitive?(x.classification.purpose==='重要账号密码'?'账号与访问凭据':'个人信息存档'):x.title;
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function option(parent,text,value){const o=el('option','',text);o.value=value;parent.append(o)}
function message(text){$('pageMessage').textContent=text;$('pageMessageBottom').textContent=text}
function validOverride(value){if(!value||typeof value!=='object')return null;const tags=Array.isArray(value.tags)?[...new Set(value.tags.map(t=>String(t).trim()).filter(t=>t&&t.length<=24))].slice(0,3):[];return {domain:value.domain==='软件与技术'?'技术宅':archive.domains.includes(value.domain)?value.domain:'杂谈',purpose:(value.domain==='软件与技术'||value.domain==='技术宅')&&value.purpose==='备忘录'?'存档':archive.purposes.includes(value.purpose)?value.purpose:'待辨识',tags,...(typeof value.useful==='boolean'?{useful:value.useful}:{})}}
__EDITOR_CODE__
function applyOverrides(){for(const x of data)x.classification=JSON.parse(JSON.stringify(base.get(x.id)));applyContentEdits();for(const x of data){const edit=validOverride(overrides[x.id]);if(edit)x.classification={...x.classification,...edit,related_domains:[],confidence:'人工调整',review_method:'用户手动调整',reason:'由用户手动调整；原始分类仍在分类原始数据.json中',review:false}}updateStats()}
function updateStats(){if($('coverage'))$('coverage').textContent=' 已逐条复核 '+archive.statistics.semantic_reviewed+' / '+data.length+' 条（含重复正文）。';$('total').textContent=data.length.toLocaleString();$('tagged').textContent=data.filter(x=>x.classification.tags.length).length.toLocaleString();$('reviewCount').textContent=data.filter(x=>x.classification.review).length.toLocaleString();$('editCount').textContent=Object.keys(overrides).length?'已手动调整 '+Object.keys(overrides).length+' 条；请导出以保留修改':'尚未手动调整分类'}
function selectors(){const old={domain:$('domain').value,purpose:$('purpose').value,tag:$('tag').value};for(const id of ['domain','purpose','tag']){$(id).replaceChildren();option($(id),id==='domain'?'全部领域':id==='purpose'?'全部用途':'全部标签','')}
for(const [id,values] of [['domain',archive.domains],['purpose',archive.purposes]])for(const value of values){const count=data.filter(x=>id==='domain'?(x.classification.domain===value||x.classification.related_domains.includes(value)):x.classification.purpose===value).length;option($(id),value+'（'+count+'）',value)}
const counts=new Map();for(const x of data)for(const t of x.classification.tags)counts.set(t,(counts.get(t)||0)+1);[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh-CN')).forEach(([t,n])=>option($('tag'),t+'（'+n+'）',t));for(const id of ['domain','purpose','tag'])if([...$(id).children].some(o=>o.value===old[id]))$(id).value=old[id]}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(overrides))}catch{storageAvailable=false;$('storageNotice').classList.remove('hide');$('storageNotice').textContent='浏览器无法持久保存修改。请使用“导出我的分类调整”，下次可重新导入。'}$('editCount').textContent='已手动调整 '+Object.keys(overrides).length+' 条；导出后可更新Markdown、Excel及bz数据'}
function editPanel(x){const a=x.classification,box=el('div','edit-box'),grid=el('div','edit-grid'),domain=el('select'),purpose=el('select');for(const v of archive.domains)option(domain,v,v);for(const v of archive.purposes)option(purpose,v,v);domain.value=a.domain;purpose.value=a.purpose;
for(const [text,input] of [['领域',domain],['用途 / 性质',purpose]]){const cell=el('div');cell.append(el('label','',text),input);grid.append(cell)}const tags=el('input');tags.value=a.tags.join('，');tags.maxLength=100;tags.setAttribute('aria-label','零到三个标签，可留空，用逗号分隔');const label=el('label','','标签（可留空，最多 3 个，用逗号分隔；不要填写密码）');const actions=el('div','actions'),save=el('button','','保存调整'),restore=el('button','','恢复初步分类'),status=el('div','edit-status');
save.onclick=async()=>{const values=tags.value.split(/[,，;；#\n]+/).map(s=>s.trim()).filter(Boolean);if(values.length>3||values.some(s=>s.length>24)){status.textContent='最多填写 3 个标签，每个不超过 24 字。';return}const c={domain:domain.value,purpose:purpose.value,tags:[...new Set(values)],useful:a.useful};if(editorConfig){save.disabled=true;try{await saveClassification(x,c)}catch(e){status.textContent='未保存：'+e.message}finally{save.disabled=false}return}overrides[x.id]=c;persist();applyOverrides();selectors();filter();message('已保存分类草稿。请导出调整文件，以更新其他格式。')};restore.onclick=async()=>{if(editorConfig){restore.disabled=true;try{await saveClassification(x,base.get(x.id))}catch(e){status.textContent='未保存：'+e.message}finally{restore.disabled=false}return}delete overrides[x.id];persist();applyOverrides();selectors();filter();message('已恢复该条的初步分类。')};actions.append(save,restore);box.append(grid,label,tags,actions,status);return box}
function content(x,body){
 const a=x.classification;
 if(a.sensitive&&revealed.has(x.id)){const hide=el('button','','重新遮挡');hide.onclick=()=>{revealed.delete(x.id);render()};body.append(hide)}
 body.append(el('div','prose entry-prose',x.text||'原库没有可读文字，仅保留元数据或附件描述。'));
 if(x.url&&/^https?:\/\//i.test(x.url)&&x.url!==x.text.trim()){const link=el('a','',x.url);link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';body.append(link)}
 if(x.detail_html&&x.preview&&x.preview!==x.text){const d=el('details','record-context');d.append(el('summary','','原列表预览'),el('div','prose',x.preview));body.append(d)}
 const explanation=[a.reason,...(a.flags||[]),x.notes].filter(Boolean).filter(t=>!t.startsWith('沿用你在QQ中设置的分组'));
 if(explanation.length){const note=el('details','record-context');note.append(el('summary','','整理说明'),el('p','',explanation.join('；')));body.append(note)}
 if(x.attachments.length){const files=el('details','record-context');files.append(el('summary','','附件引用（'+x.attachments.length+'）'));for(const ref of x.attachments)files.append(el('p','small',(ref.filename||ref.kind)+(ref.path?' · 原路径：'+ref.path:'')));body.append(files)}
 const footer=el('div','entry-footer'),actions=el('div','entry-actions'),metadata=el('div','entry-metadata'),panels=el('div','entry-editors');
 const textEdit=bodyEditor(x),classEdit=el('details','entry-panel');textEdit.classList.add('entry-panel');classEdit.append(el('summary','','调整分类与标签'),editPanel(x));panels.append(textEdit,classEdit);
 for(const [label,panel] of [['编辑标题与正文',textEdit],['调整分类与标签',classEdit]]){const button=el('button','',label);button.setAttribute('aria-expanded','false');button.onclick=()=>{panel.open=!panel.open;button.setAttribute('aria-expanded',String(panel.open));};panel.addEventListener('toggle',()=>{button.setAttribute('aria-expanded',String(panel.open));refreshThemedSelects();});actions.append(button)}
 const copy=el('button','','复制正文');copy.onclick=()=>copyText(x.text,copy);actions.append(copy);
 if(x.note_path){const link=el('a','','Markdown');link.href=x.note_path;actions.append(link)}
 for(const [label,value] of [['来源',x.source],['发送者',x.sender],['收藏 ID',x.id],['原始范围',x.status]])if(value){const item=el('span','',label+'：'+value);item.title=item.textContent;metadata.append(item)}
 footer.append(actions,metadata);body.append(footer,panels);
 if(x.local_source_conflict)body.append(el('p','storage-notice','QQ 原文已更新，本地文字已保留。请打开正文编辑区，对照原文合并。'));
}

function card(x){const a=x.classification,d=el('details','card');d.id=x.id;const summary=el('summary'),classification=el('div','classification');classification.append(el('span','badge',x.qq_group||'未分组'),el('span','badge domain-badge',a.domain),el('span','badge purpose-badge',a.purpose));if(a.review)classification.append(el('span','review',a.review_method==='旧版分类，未逐条复核'?'旧版候选 · 待复核':'待复核'));if(a.review_method==='完整正文语义复核')classification.append(el('span','badge','正文已复核'));if(overrides[x.id]||contentEdits[x.id])classification.append(el('span','badge',contentEdits[x.id]?'本地已编辑':'已调整'));if(x.local_source_conflict)classification.append(el('span','review','QQ 原文有更新'));const meta=el('div','meta');meta.append(el('span','',x.date||'时间未知'),el('span','',x.type));if(a.duplicate_of)meta.append(el('span','','完全重复正文'));summary.append(classification,meta,el('h2',a.sensitive?'sensitive-title':'',safeTitle(x)));
summary.append(el('div','preview',a.sensitive?'此条可能含账号、密码或个人资料，正文与原始标题默认遮挡。':x.text?x.text.slice(0,150)+(x.text.length>150?'…':''):'暂无可读正文'));if(a.tags.length){const row=el('div','tag-row');for(const t of a.tags){const button=el('button','tag','#'+t);button.onclick=e=>{e.preventDefault();e.stopPropagation();$('tag').value=t;filter()};row.append(button)}summary.append(row)}
const body=el('div','content');if(a.sensitive&&!revealed.has(x.id)){const box=el('div','sensitive-box');box.append(el('div','','以下内容仅在你点击后显示。遮挡只影响页面展示，本地HTML及JSON仍包含原始文字，不等于加密。'));const reveal=el('button','','仅展开这一条');reveal.onclick=()=>{revealed.add(x.id);body.replaceChildren();content(x,body)};box.append(reveal);body.append(box)}else content(x,body);d.append(summary,body);return d}
async function copyText(text,b){try{await navigator.clipboard.writeText(text);b.textContent='已复制'}catch{const t=el('textarea','',text);document.body.append(t);t.select();b.textContent=document.execCommand('copy')?'已复制':'请手动选择正文复制';t.remove()}setTimeout(()=>b.textContent='复制正文',1500)}
function render(){if(!mayLeaveEditor())return;const pages=Math.ceil(filtered.length/size);page=Math.max(0,Math.min(page,pages-1));$('result').textContent='找到 '+filtered.length.toLocaleString()+' 条收藏';$('page').textContent=pages?(page+1)+' / '+pages:'0 / 0';message('');for(const suffix of ['','Bottom']){$('pageInput'+suffix).value=pages?String(page+1):'';$('pageInput'+suffix).max=String(Math.max(1,pages));$('pageInput'+suffix).disabled=!pages;$('pageGo'+suffix).disabled=!pages;$('pageTotal'+suffix).textContent='/ '+pages+' 页'}$('cards').replaceChildren();if(filtered.length)filtered.slice(page*size,(page+1)*size).forEach(x=>$('cards').append(card(x)));else $('cards').append(el('div','empty','没有匹配的收藏，试试其他筛选条件。'));refreshThemedSelects();for(const id of ['prev','prevBottom'])$(id).disabled=page<=0;for(const id of ['next','nextBottom'])$(id).disabled=page+1>=pages}
function filter(){if(!mayLeaveEditor())return;const qqGroup=$('qqGroup').value,domain=$('domain').value,purpose=$('purpose').value,tag=$('tag').value,view=$('view').value,year=$('year').value,terms=$('query').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);filtered=data.filter(x=>{const a=x.classification;if(qqGroup&&qqGroup!==(x.qq_group||'未分组'))return false;if(domain&&domain!==a.domain&&!a.related_domains.includes(domain)||purpose&&purpose!==a.purpose||tag&&!a.tags.includes(tag)||year&&year!==yearOf(x)||$('hideDuplicates').checked&&a.duplicate_of)return false;if(view==='useful'&&!a.useful||view==='review'&&!a.review||view==='skipped'&&a.tags.length>0||view==='sensitive'&&!a.sensitive||view==='edited'&&!overrides[x.id]&&!contentEdits[x.id]||view==='semantic'&&a.review_method!=='完整正文语义复核'||view==='model'&&a.review_method!=='旧版分类，未逐条复核')return false;const searchable=[safeTitle(x),a.sensitive?'':x.text,a.sensitive?'':x.preview,a.sensitive?'':x.source,a.sensitive?'':x.sender,x.id,x.qq_group,a.domain,...a.related_domains,a.purpose,...a.tags].join('\n').toLocaleLowerCase();return terms.every(t=>searchable.includes(t))});if($('sort').value==='old')filtered.reverse();page=0;render()}
function goPage(raw){const n=Math.ceil(filtered.length/size),p=Number(String(raw).trim());if(!n){message('当前没有可跳转的页面。');return false}if(!String(raw).trim()||!Number.isInteger(p)||p<1||p>n){message('请输入 1 至 '+n+' 之间的整数页码。');return false}if(!mayLeaveEditor())return false;page=p-1;render();$('query').scrollIntoView({block:'start'});return true}
function reset(){for(const id of ['query','qqGroup','domain','purpose','tag','year'])$(id).value='';$('view').value='useful';$('sort').value='new';$('hideDuplicates').checked=false;filter()}
for(const suffix of ['','Bottom'])$('pageJumpForm'+suffix).addEventListener('submit',e=>{e.preventDefault();goPage($('pageInput'+suffix).value)});for(const id of ['qqGroup','domain','purpose','tag','view','year','sort','hideDuplicates'])$(id).addEventListener('change',filter);let timer;$('query').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(filter,170)});$('reset').onclick=reset;for(const id of ['prev','prevBottom'])$(id).onclick=()=>{if(!mayLeaveEditor())return;page--;render();$('query').scrollIntoView({block:'start'})};for(const id of ['next','nextBottom'])$(id).onclick=()=>{if(!mayLeaveEditor())return;page++;render();$('query').scrollIntoView({block:'start'})};
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('exportEdits').onclick=()=>download('QQ收藏_分类调整.json',{schema:'qq-classification-overrides-v1',dataset:archive.dataset,overrides});$('importEdits').onclick=()=>$('editFile').click();$('editFile').onchange=async()=>{const f=$('editFile').files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.schema!=='qq-classification-overrides-v1'||obj.dataset!==archive.dataset||!obj.overrides||typeof obj.overrides!=='object')throw new Error('不是本批收藏的分类调整文件');for(const [id,v] of Object.entries(obj.overrides))if(base.has(id)&&validOverride(v))overrides[id]=validOverride(v);persist();applyOverrides();selectors();filter();message('已导入分类调整。')}catch(e){message('导入失败：'+e.message)}$('editFile').value=''};
function jump(){let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{return}if(!id)return;reset();$('view').value='all';filter();const i=filtered.findIndex(x=>x.id===id);if(i<0)return;page=Math.floor(i/size);render();const d=$(id);if(d){d.open=true;d.scrollIntoView({block:'start'})}}
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');for(const [id,v] of Object.entries(saved))if(base.has(id)&&validOverride(v))overrides[id]=validOverride(v)}catch{storageAvailable=false;$('storageNotice').classList.remove('hide');$('storageNotice').textContent='当前浏览器不能读取本地分类调整缓存；修改后请导出调整文件。'}applyOverrides();selectors();[...new Set(data.map(yearOf))].sort().reverse().forEach(y=>option($('year'),y,y));for(const g of [...new Set(data.map(x=>x.qq_group||'未分组'))].sort())option($('qqGroup'),g+'（'+data.filter(x=>(x.qq_group||'未分组')===g).length+'）',g);reset();window.addEventListener('hashchange',jump);jump();editorStatus();
</script></body></html>
