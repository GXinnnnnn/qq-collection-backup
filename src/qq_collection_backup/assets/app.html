<script>
const $=id=>document.getElementById(id);let state=null,selected=new Set(),busy=false,toastTimer,pollTimer;const icon=name=>{const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#'+name);svg.append(use);return svg};
function notify(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),4800)}
async function api(name,...args){try{return await window.pywebview.api[name](...args)}catch(e){notify('操作未完成：'+String(e));return {error:String(e)}}}
function status(main,sub='',kind=''){ $('statusMain').textContent=main;if(sub)$('statusSub').textContent=sub;$('statusDot').className='status-dot '+kind}
function setBusy(value){busy=value;document.body.classList.toggle('busy',value);$('progress').classList.toggle('running',value);$('cancel').hidden=!value;$('openOutput').disabled=value;for(const id of ['refresh','accountButton','chooseFile','chooseFolder','chooseOutput','output','selectAll','selectNone'])$(id).disabled=value;document.querySelectorAll('.dataset input').forEach((x,i)=>x.disabled=value||!state.datasets[i].available);updateSelected();if(!value)$('cancel').textContent='取消任务'}
function updateSelected(){ $('selectedCount').textContent='已选择 '+selected.size+' 项';$('start').disabled=busy||!state?.source||!selected.size;$('start').textContent=busy?'正在导出…':state?.only?'一键备份收藏':'开始导出 / 更新';document.querySelectorAll('.dataset').forEach((label,i)=>{const checkbox=label.querySelector('input');label.classList.toggle('selected',checkbox.checked);label.querySelector('.selection-state').textContent=!state.datasets[i].available?'未找到':checkbox.checked?'已选择':''})}
function render(next){if(next.error){notify(next.error);return}if(next.cancelled)return;state=next;selected=new Set(next.selected);$('windowTitle').textContent=$('title').textContent=next.only?'QQ 收藏备份':'QQ 本地备份';$('description').textContent=next.only?'自动定位账号，一键保存 QQ 原分组、文字、网页与本机附件。':'选择需要的内容，保存为网页、Markdown、Excel 和原样附件。';$('scopeText').textContent=next.only?'只处理收藏':'仅在本机读取与保存';$('accountLabel').textContent=next.account?(next.account.startsWith('手动_')?'手动选择的数据库':next.account):'未检测到账号，手动选择';$('sourcePath').textContent=next.source||'可手动选择 .db 文件或账号文件夹';$('output').value=next.output;$('selectionTools').hidden=next.only;$('datasetPanel').hidden=next.only;$('sourceHint').textContent=next.only?'自动使用系统文档特殊路径；只导出收藏。加密库仅在本机只读匹配密钥，不上传、不注入。':'';
if(!next.only)$('sourceHint').textContent=next.source?'源数据库保持只读，导出使用副本。':'未检测到可用账号。请选择原电脑的 .db 文件或 nt_db 文件夹。';$('datasetHint').textContent=next.only?'收藏详情依赖本机缓存；本机没有的图片会列入缺失清单。':next.source?'收藏与好友可直接检索；其余库按原始表导出，未缓存的媒体不下载。':'先选择账号或数据库文件，即可勾选需要保存的内容。';$('datasets').replaceChildren();
for(const d of next.datasets){const label=document.createElement('label');label.className='dataset'+(!d.available?' unavailable':'');const input=document.createElement('input');input.type='checkbox';input.checked=selected.has(d.key);input.disabled=!d.available;input.setAttribute('aria-label',d.title);const box=document.createElement('span');box.className='checkbox';box.setAttribute('aria-hidden','true');box.append(icon('check'));const info=document.createElement('span');info.className='dataset-info';const title=document.createElement('span');title.className='dataset-name';title.textContent=d.title;if(d.generic){const tag=document.createElement('span');tag.className='dataset-tag';tag.textContent='原表';title.append(tag)}const filename=document.createElement('span');filename.className='dataset-file';filename.textContent=d.filename;filename.title=d.filename;info.append(title,filename);const selection=document.createElement('span');selection.className='selection-state';label.append(input,box,info,selection);input.addEventListener('change',()=>{if(input.checked)selected.add(d.key);else selected.delete(d.key);updateSelected()});$('datasets').append(label)}
$('accountMenu').replaceChildren();for(const a of next.accounts){const button=document.createElement('button');button.className='account-item';button.setAttribute('role','option');button.setAttribute('aria-selected',a.path===next.source?'true':'false');button.textContent=a.label;const small=document.createElement('small');small.textContent=a.path;button.append(small);button.onclick=async()=>{closeMenu();render(await api('choose_account',a.path))};$('accountMenu').append(button)}if(!next.accounts.length){const item=document.createElement('div');item.className='account-item';item.textContent='未发现账号，请手动选择数据库';$('accountMenu').append(item)}setBusy(next.busy);if(!busy)status(next.source?'准备就绪':'请选择数据来源','再次运行会同步更新，并保留上一版')}
function closeMenu(){$('accountMenu').classList.remove('open');$('accountButton').setAttribute('aria-expanded','false')}
$('accountButton').onclick=()=>{if(busy)return;const rect=$('accountButton').getBoundingClientRect();$('accountMenu').style.left=rect.left+'px';$('accountMenu').style.top=rect.bottom+7+'px';$('accountMenu').style.width=Math.max(300,rect.width)+'px';const open=$('accountMenu').classList.toggle('open');$('accountButton').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!$('accountButton').contains(e.target)&&!$('accountMenu').contains(e.target))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});document.querySelector('.content').addEventListener('scroll',closeMenu);
$('chooseKeymap').onclick=async()=>render(await api('pick_keymap'));$('refresh').onclick=async()=>render(await api('refresh'));$('chooseFile').onclick=async()=>render(await api('pick_source','file'));$('chooseFolder').onclick=async()=>render(await api('pick_source','folder'));$('chooseOutput').onclick=async()=>{const r=await api('pick_output');if(r.error)notify(r.error);else if(r.output)$('output').value=r.output};$('selectAll').onclick=()=>{if(busy)return;selected=new Set(state.datasets.filter(x=>x.available).map(x=>x.key));document.querySelectorAll('.dataset input:not(:disabled)').forEach(x=>x.checked=true);updateSelected()};$('selectNone').onclick=()=>{if(busy)return;selected.clear();document.querySelectorAll('.dataset input').forEach(x=>x.checked=false);updateSelected()};
$('start').onclick=async()=>{if(busy)return;closeMenu();const out=$('output').value.trim();if(!out){notify('请选择保存位置');return}setBusy(true);status('正在取得数据库快照','请保持QQ登录，可随时取消任务','running');const r=await api('start',Array.from(selected),out);if(r.error){setBusy(false);status('未开始导出',r.error,'error');notify(r.error)}};
$('cancel').onclick=async()=>{await api('cancel',false);$('cancel').textContent='正在取消…';status('正在安全取消','已完成的数据库会保留，其余旧版不变','running')};$('openOutput').onclick=async()=>{const r=await api('open_output',$('output').value);if(r.error)notify(r.error)};
async function requestClose(){const r=await api('close');if(r.busy&&!$('closeDialog').open)$('closeDialog').showModal()};$('close').onclick=requestClose;$('minimize').onclick=()=>api('minimize');$('maximize').onclick=()=>api('maximize');$('keepRunning').onclick=()=>$('closeDialog').close();$('cancelAndClose').onclick=async()=>{$('closeDialog').close();await api('cancel',true);status('正在取消并关闭','等待当前步骤结束后自动关闭','running')};$('dismissResult').onclick=()=>$('resultDialog').close();
function addLog(text){const lines=($('log').textContent+'\n'+text).trim().split('\n');$('log').textContent=lines.slice(-100).join('\n');$('log').scrollTop=$('log').scrollHeight}
async function poll(){const p=await api('poll');if(p.messages){for(const m of p.messages){if(m.kind==='log'){addLog(m.text);status(m.text,'正在处理，请保持QQ登录','running')}else if(m.kind==='close_request'){if(!$('closeDialog').open)$('closeDialog').showModal()}else if(m.kind==='complete'){addLog('已完成 '+m.completed+' 个数据库；失败 '+m.failed.length+' 个。');status(m.ok?'导出完成':'部分完成，请查看记录',m.ok?'已保存到本机，可打开结果文件夹':'失败的数据库保留旧版',m.ok?'success':'error');if(m.failed.length){$('resultTitle').textContent=m.completed?'部分数据库未完成':'导出未完成';$('resultText').textContent=m.failed.map(x=>x.database+'：'+x.error).join('\n\n');$('resultDialog').showModal()}else notify('导出完成，结果已保存到所选位置。')}else{addLog(m.text);status(m.kind==='cancelled'?'任务已取消':'导出未完成',m.text,m.kind==='error'?'error':'');if(m.kind==='error')notify(m.text)}}setBusy(p.busy)}pollTimer=setTimeout(poll,650)}
window.addEventListener('pywebviewready',async()=>{render(await api('state'));poll()});
</script></body></html>
