[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-collection-backup"
version = "1.0.0"
description = "Back up your local QQ NT favorites and organize them as editable offline notes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["openpyxl==3.1.5", "cryptography==50.0.2", "pywebview==6.2.1; sys_platform == 'win32'", "pythonnet==3.2.1; sys_platform == 'win32'"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Topic :: Utilities"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
qq-collection-backup = "qq_collection_backup.cli:main"
qq-collection-editor = "qq_collection_backup.editor_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qq_collection_backup = ["assets/*.html", "assets/*.css", "assets/*.js", "assets/*.md"]
